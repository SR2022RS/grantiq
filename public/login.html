<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in — GrantIQ Command Center</title>
<meta name="robots" content="noindex, nofollow" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0E1219;
  --surface: #161D27;
  --surface-2: #1c2433;
  --hairline: rgba(245, 165, 36, 0.12);
  --hairline-2: rgba(255,255,255,0.08);
  --text: #F0F4F8;
  --text-2: #b3bac4;
  --text-3: #94A3B8;
  --text-4: #6b7385;
  --accent: #f5a524;
  --accent-2: #ffbe4d;
  --accent-bg: rgba(245, 165, 36, 0.08);
  --accent-border: rgba(245, 165, 36, 0.25);
  --red: #f0506e;
  --font-serif: "Libre Baskerville", Georgia, serif;
  --font-sans: "Source Sans 3", -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font-sans);
  background: var(--bg); color: var(--text);
  min-height: 100vh;
  display: grid; place-items: center;
  padding: 24px;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: 0;
  background-image:
    radial-gradient(900px circle at 80% -10%, rgba(245,165,36,0.08), transparent 50%),
    radial-gradient(800px circle at -10% 30%, rgba(245,165,36,0.04), transparent 60%);
  pointer-events: none;
}
.card {
  position: relative; z-index: 1;
  width: 100%; max-width: 420px;
  background: var(--surface);
  border: 1px solid var(--accent-border);
  border-radius: 16px;
  padding: 36px 36px 30px;
  box-shadow: 0 36px 80px rgba(0,0,0,0.5), 0 0 0 6px rgba(245,165,36,0.04);
}
.brand {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 24px;
}
.brand-mark {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--accent);
  display: grid; place-items: center;
  font-family: var(--font-serif); font-weight: 700;
  color: #0E1219; font-size: 15px;
  box-shadow: 0 0 0 4px rgba(245,165,36,0.12);
}
.brand-name {
  font-family: var(--font-serif);
  font-weight: 700; font-size: 22px; letter-spacing: -0.01em;
}
.brand-name .accent-i { color: var(--accent); font-style: italic; }
.eyebrow {
  font-family: var(--font-mono); font-size: 10.5px;
  letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent);
  margin-bottom: 8px;
}
h1 {
  font-family: var(--font-serif);
  font-size: 26px; font-weight: 700; letter-spacing: -0.01em;
  margin-bottom: 8px;
}
.sub { color: var(--text-3); font-size: 14.5px; line-height: 1.55; margin-bottom: 22px; }
form { display: flex; flex-direction: column; gap: 12px; }
label {
  font-family: var(--font-mono); font-size: 10.5px;
  letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-3);
  margin-bottom: 4px;
}
input[type="password"] {
  width: 100%;
  background: rgba(10,13,18,0.6);
  border: 1px solid var(--hairline-2);
  border-radius: 8px;
  padding: 12px 14px;
  font-family: var(--font-sans); font-size: 15px;
  color: var(--text);
}
input[type="password"]::placeholder { color: var(--text-4); }
input[type="password"]:focus { outline: none; border-color: var(--accent-border); }
button {
  cursor: pointer; border: none; font-family: inherit;
  background: var(--accent); color: #0E1219;
  padding: 13px 20px; border-radius: 8px;
  font-weight: 600; font-size: 15.5px;
  margin-top: 6px;
  box-shadow: 0 8px 28px rgba(245,165,36,0.22), inset 0 1px 0 rgba(255,255,255,0.25);
  transition: background 0.15s, transform 0.15s;
}
button:hover:not(:disabled) { background: var(--accent-2); transform: translateY(-1px); }
button:disabled { opacity: 0.6; cursor: default; }
.err {
  color: var(--red); font-size: 13px; min-height: 0;
  margin-top: -2px;
}
.foot {
  margin-top: 18px; text-align: center;
  font-family: var(--font-mono); font-size: 10.5px;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-4);
}
.foot a { color: var(--text-3); text-decoration: none; }
.foot a:hover { color: var(--accent); }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <span class="brand-mark">G</span>
      <span class="brand-name">Grant<span class="accent-i">IQ</span></span>
    </div>
    <div class="eyebrow">Command Center</div>
    <h1>Sign in</h1>
    <p class="sub">Enter your portal password to continue. Sessions last 7 days.</p>

    <form id="f" autocomplete="off">
      <div>
        <div style="display:flex;flex-direction:column;gap:4px;">
          <label for="pw">Password</label>
          <input id="pw" name="password" type="password" autocomplete="current-password" autofocus required />
        </div>
      </div>
      <div class="err" id="err" role="alert"></div>
      <button type="submit" id="btn">Sign in</button>
    </form>

    <div class="foot">
      <a href="/">← Back to grantiq.operatorhq.agency</a>
    </div>
  </div>

<script>
const params = new URLSearchParams(location.search);
const next = params.get("next") || "/portal";
const f = document.getElementById("f");
const err = document.getElementById("err");
const btn = document.getElementById("btn");

f.addEventListener("submit", async (e) => {
  e.preventDefault();
  err.textContent = "";
  const password = document.getElementById("pw").value;
  if (!password) { err.textContent = "Password is required."; return; }
  btn.disabled = true; const orig = btn.textContent; btn.textContent = "Signing in…";
  try {
    const r = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password, next }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { err.textContent = d.error || "Incorrect password."; btn.disabled = false; btn.textContent = orig; return; }
    window.location.href = d.redirect || "/portal";
  } catch {
    err.textContent = "Network error. Please try again.";
    btn.disabled = false; btn.textContent = orig;
  }
});
</script>
</body>
</html>
